name: Format Instagram AI Title Changes

on:
  push:
    branches:
      - feature/instagram-ai-titles

permissions:
  contents: write

concurrency:
  group: format-instagram-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(instagram): format AI title generation')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./tooling/github/setup
      - name: Format source
        run: |
          pnpm exec oxfmt --write \
            apps/workers/workers/inference/summarize.ts \
            apps/workers/workers/inference/instagramTitle.ts \
            apps/workers/workers/inference/instagramTitle.test.ts
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/workers/workers/inference/summarize.ts apps/workers/workers/inference/instagramTitle.ts apps/workers/workers/inference/instagramTitle.test.ts
          if ! git diff --cached --quiet; then
            HUSKY=0 git -c core.hooksPath=/dev/null commit -m "style(instagram): format AI title generation"
            git pull --rebase origin feature/instagram-ai-titles
            git push origin HEAD:feature/instagram-ai-titles
          fi
