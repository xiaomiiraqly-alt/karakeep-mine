name: Format AI Tag Vocabulary

on:
  push:
    branches:
      - feature/canonical-ai-tags

permissions:
  contents: write

concurrency:
  group: format-ai-tags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(tags): apply canonical formatter')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./tooling/github/setup
      - name: Format files
        run: |
          pnpm exec oxfmt --write \
            apps/workers/workers/inference/tagVocabulary.ts \
            apps/workers/workers/inference/tagVocabulary.test.ts \
            apps/workers/workers/inference/tagging.ts \
            packages/shared/prompts.ts
      - name: Commit formatter results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/workers/workers/inference/tagVocabulary.ts apps/workers/workers/inference/tagVocabulary.test.ts apps/workers/workers/inference/tagging.ts packages/shared/prompts.ts
          if ! git diff --cached --quiet; then
            HUSKY=0 git -c core.hooksPath=/dev/null commit -m "style(tags): apply canonical formatter"
            git pull --rebase origin feature/canonical-ai-tags
            git push origin HEAD:feature/canonical-ai-tags
          fi
