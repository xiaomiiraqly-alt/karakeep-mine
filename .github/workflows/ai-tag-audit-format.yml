name: Format Tag Audit Changes
on:
  push:
    branches: [feature/canonical-ai-tags]

permissions:
  contents: write

concurrency:
  group: tag-audit-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(tags): format audit implementation')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./tooling/github/setup
      - name: Format touched source
        run: |
          pnpm exec oxfmt --write \
            packages/shared/utils/tagConcepts.ts \
            packages/shared/utils/tagAudit.ts \
            packages/shared/utils/tagAudit.test.ts \
            apps/workers/workers/inference/tagVocabulary.ts \
            packages/trpc/routers/tags.ts \
            apps/web/components/dashboard/tags/TagAudit.tsx \
            apps/web/components/dashboard/tags/AllTagsView.tsx
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/utils/tagConcepts.ts packages/shared/utils/tagAudit.ts packages/shared/utils/tagAudit.test.ts apps/workers/workers/inference/tagVocabulary.ts packages/trpc/routers/tags.ts apps/web/components/dashboard/tags/TagAudit.tsx apps/web/components/dashboard/tags/AllTagsView.tsx
          if ! git diff --cached --quiet; then
            HUSKY=0 git -c core.hooksPath=/dev/null commit -m "style(tags): format audit implementation"
            git pull --rebase origin feature/canonical-ai-tags
            git push origin HEAD:feature/canonical-ai-tags
          fi
