name: One-time markdown-it security patch lockfile update
on:
  push:
    branches: [audit-pnpm-security-updates]
    paths: [.github/workflows/markdown-patch-lock.yml]
permissions:
  contents: write
jobs:
  verify-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.28.9
          run_install: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - name: Regenerate lockfile for patched markdown-it
        run: pnpm install --no-frozen-lockfile
      - name: Verify mobile markdown compatibility
        run: pnpm --filter @karakeep/mobile test
      - name: Verify Docusaurus
        run: pnpm --filter @karakeep/docs build
      - name: Security audit after patch
        run: |
          pnpm audit --audit-level high || echo "Remaining unrelated advisories are documented separately."
      - name: Commit the exact tested lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "security(deps): lock markdown-it 14.3.3 security fix"
            git push origin HEAD:audit-pnpm-security-updates
          fi
