name: One-time canonical formatter
on:
  push:
    branches:
      - fix/persisted-tagging-status-v035
    paths:
      - .github/workflows/format-one-time.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'xiaomiiraqly-alt/karakeep-mine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: fix/persisted-tagging-status-v035
          persist-credentials: true
      - name: Install dependencies
        uses: ./tooling/github/setup
      - name: Apply canonical oxfmt to changed files
        run: |
          pnpm exec oxfmt --write apps/workers/workers/inference/tagging.ts apps/workers/workers/inference/tagging.test.ts apps/workers/workers/inference/tagging.integration.test.ts
      - name: Commit formatted files and remove temporary formatter
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/format-one-time.yml
          git add apps/workers/workers/inference/tagging.ts apps/workers/workers/inference/tagging.test.ts apps/workers/workers/inference/tagging.integration.test.ts .github/workflows/format-one-time.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format tagging fixes and remove one-time formatter"
          git push origin HEAD:fix/persisted-tagging-status-v035
