name: Validate upstream v0.35 integration
on:
  push:
    branches: [upstream-v035-provisional]
  workflow_dispatch:
concurrency:
  group: upstream-v035-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.merge.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare candidate without changing workflow files
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/karakeep-app/karakeep.git
          git fetch --no-tags upstream refs/tags/v0.35.0:refs/tags/upstream-v0.35.0
          test "$(git rev-parse upstream-v0.35.0^{commit})" = ac46f47b9d4a3c8f3c43f93a7f5da7009b297d69
          if ! git merge-base --is-ancestor upstream-v0.35.0 HEAD; then
            git merge --no-ff --no-commit -X ours upstream-v0.35.0
            # Workflow changes are reviewed and applied separately with an authorized connector.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit -m "merge: upstream v0.35.0 candidate; conflicting application hunks require review"
            git push origin HEAD:upstream-v035-provisional
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --stat upstream-v0.35.0 HEAD
      - name: Record application delta for review
        run: |
          git diff upstream-v0.35.0 HEAD -- apps/workers packages/shared docker/Dockerfile > upstream-review.patch
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-review
          path: upstream-review.patch
  checks:
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - pnpm typecheck
          - pnpm lint
          - pnpm format
          - pnpm --filter @karakeep/shared --filter @karakeep/workers --filter @karakeep/trpc --filter @karakeep/web test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.candidate }}
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Run validation
        run: ${{ matrix.command }}
