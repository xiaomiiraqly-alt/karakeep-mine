name: Instagram integration verification

on:
  push:
    branches:
      - feature/instagram-media-ai
  pull_request:
    paths:
      - "apps/workers/**"
      - "packages/db/schema.ts"
      - "packages/trpc/lib/attachments.ts"
      - "docker/Dockerfile"
      - ".github/workflows/instagram-integration.yml"
  workflow_dispatch:

# Keep only the latest validation run for each PR or branch.
concurrency:
  group: instagram-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoformat:
    # One-time branch cleanup. This job will be removed after committing
    # oxfmt's canonical output and is never allowed on pull_request events.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/instagram-media-ai'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./tooling/github/setup
      - name: Check out latest feature branch
        run: |
          git fetch origin feature/instagram-media-ai
          git checkout -B feature/instagram-media-ai origin/feature/instagram-media-ai
      - name: Apply repository formatter to workers
        run: pnpm --filter @karakeep/workers format:fix
      - name: Commit formatted workers changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/workers
          if ! git diff --cached --quiet; then
            git commit -m "style(instagram): apply oxfmt formatting"
            git pull --rebase origin feature/instagram-media-ai
            git push origin HEAD:feature/instagram-media-ai
          fi

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./tooling/github/setup
      - name: Typecheck workers
        run: pnpm --filter @karakeep/workers typecheck
      - name: Unit tests for Instagram URLs
        run: pnpm --filter @karakeep/workers exec vitest run workers/utils/instagramUrls.test.ts
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build custom all-in-one image (no publishing)
        run: docker build --target aio -t karakeep-instagram:smoke -f docker/Dockerfile .
      - name: Check Instagram downloader is included
        run: docker run --rm --entrypoint /usr/local/bin/gallery-dl karakeep-instagram:smoke --version
      - name: Check FFmpeg is included
        run: docker run --rm --entrypoint /usr/bin/ffmpeg karakeep-instagram:smoke -version
