name: Instagram integration verification

on:
  push:
    branches:
      - main
      - feature/instagram-media-ai
  pull_request:
    paths:
      - "apps/workers/**"
      - "packages/db/schema.ts"
      - "packages/trpc/lib/attachments.ts"
      - "packages/trpc/lib/instagramReaderAssets.ts"
      - "packages/trpc/lib/instagramReaderAssets.test.ts"
      - "packages/trpc/models/bookmarks.ts"
      - "docker/Dockerfile"
      - ".github/workflows/instagram-integration.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/staging-image.yml"
      - "scripts/production-preflight.sh"
      - "scripts/production-backup.sh"
      - "scripts/verify-production-backup.py"
      - "scripts/rehearse-db-migration.sh"
      - "scripts/rehearse-web-startup.sh"
      - "scripts/tests/**"
      - "scripts/security-audit-gate.py"
      - "scripts/tests/test_security_audit_gate.py"
      - "docs/production-deployment.md"
      - "packages/trpc/lib/instagramReaderAssets.ts"
  workflow_dispatch:

# Keep only the latest validation run for each PR or branch.
concurrency:
  group: instagram-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: $/tooling/github/setup
      - name: Typecheck workers
        run: pnpm --filter @karakeep/workers typecheck
      - name: Unit tests for Instagram URLs, gallery, and anonymous public downloads
        run: pnpm --filter @karakeep/workers exec vitest run workers/utils/instagramUrls.test.ts workers/utils/instagramReaderHtml.test.ts workers/utils/instagramPublic.test.ts
      - name: Unit tests for Reader asset URL authorization
        run: pnpm --filter @karakeep/trpc exec vitest run lib/instagramReaderAssets.test.ts
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - name: Free space for the all-in-one image
        # This job builds inside Docker and does not use the host mobile/.NET SDKs.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
      - name: Build custom all-in-one image (no publishing)
        run: docker build --target aio -t karakeep-instagram:smoke -f docker/Dockerfile .
      - name: Check Instagram downloader is included
        run: docker run --rm --entrypoint /usr/local/bin/gallery-dl karakeep-instagram:smoke --version
      - name: Check FFmpeg is included
        run: docker run --rm --entrypoint /usr/bin/ffmpeg karakeep-instagram:smoke -version

  security-and-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: $/tooling/github/setup
      - name: Check read-only production preflight syntax
        run: bash -n scripts/production-preflight.sh
      - name: Check opt-in production backup syntax
        run: bash -n scripts/production-backup.sh
      - name: Check isolated migration rehearsal syntax
        run: bash -n scripts/rehearse-db-migration.sh
      - name: Check isolated web startup rehearsal syntax
        run: bash -n scripts/rehearse-web-startup.sh
      - name: Check isolated restore verifier syntax
        run: python3 -m py_compile scripts/verify-production-backup.py
      - name: Test security and backup verification tools
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Audit full workspace; fail on unexpected HIGH/CRITICAL advisories
        run: python3 scripts/security-audit-gate.py
