name: Format Instagram Reader PR

on:
  push:
    branches:
      - feature/instagram-inline-reader

permissions:
  contents: write

concurrency:
  group: format-instagram-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(instagram): apply oxfmt for anonymous downloader')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./tooling/github/setup
      - name: Synchronize branch
        run: |
          git fetch origin feature/instagram-inline-reader
          git checkout -B feature/instagram-inline-reader origin/feature/instagram-inline-reader
      - name: Format modified source
        run: |
          pnpm exec oxfmt --write \
            apps/workers/workers/instagram.ts \
            apps/workers/workers/utils/instagramPublic.ts \
            apps/workers/workers/utils/instagramPublic.test.ts \
            apps/workers/workers/utils/instagramReaderHtml.ts \
            apps/workers/workers/utils/instagramReaderHtml.test.ts \
            packages/trpc/models/bookmarks.ts \
            packages/trpc/lib/instagramReaderAssets.ts \
            packages/trpc/lib/instagramReaderAssets.test.ts
      - name: Commit formatter results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/workers/workers/instagram.ts apps/workers/workers/utils/instagramPublic.ts apps/workers/workers/utils/instagramPublic.test.ts apps/workers/workers/utils/instagramReaderHtml.ts apps/workers/workers/utils/instagramReaderHtml.test.ts packages/trpc/models/bookmarks.ts packages/trpc/lib/instagramReaderAssets.ts packages/trpc/lib/instagramReaderAssets.test.ts
          if ! git diff --cached --quiet; then
            HUSKY=0 git -c core.hooksPath=/dev/null commit -m "style(instagram): apply oxfmt for anonymous downloader"
            git pull --rebase origin feature/instagram-inline-reader
            git push origin HEAD:feature/instagram-inline-reader
          fi
